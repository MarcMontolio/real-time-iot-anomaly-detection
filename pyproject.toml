[project]
name = "real-time-iot-anomaly-detection"
version = "0.1.0"
description = "Real-time IoT anomaly detection system using fastAPI, MQTT Redis, PostgreSQL and machine learning."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "fastapi",
    "uvicorn",
    "pydantic-settings",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
