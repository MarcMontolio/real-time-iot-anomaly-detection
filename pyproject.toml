[project]
name = "real-time-iot-anomaly-detection"
version = "0.1.0"
description = "Real-time IoT anomaly detection system using FastAPI, MQTT, Redis, PostgreSQL and machine learning."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "psycopg[binary]",
    "alembic",
    "paho-mqtt",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["docker*"]
[tool.ruff.lint.per-file-ignores]
"app/api/v1/endpoints/*.py" = ["B008"]
"app/mqtt/ingestion.py" = ["TRY004"]
"app/mqtt/parser.py" = ["TRY004"]
